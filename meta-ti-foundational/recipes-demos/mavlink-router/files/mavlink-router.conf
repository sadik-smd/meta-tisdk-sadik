# /etc/mavlink-router/main.conf
#
# MAVLink Router configuration for AM62P Drone GCS
#
# Routing topology:
#
#   [Autopilot] <--UART--> [Telemetry Radio] <--UART--> mavlink-router
#                                                              |
#                                           +-----------------+------------------+
#                                           |                 |                  |
#                                    [QGC UDP]        [MAVSDK UDP]       [Remote GCS UDP]
#                                    127.0.0.1:14550  127.0.0.1:14540   0.0.0.0:14551
#
# References:
#   https://github.com/mavlink-router/mavlink-router#conf-file

[General]
# TCP server port for ad-hoc debug clients (e.g. Mission Planner over Wi-Fi)
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = common
# Log incoming MAVLink streams for post-flight analysis
# Log = /var/log/mavlink-router

# ---------------------------------------------------------------------------
# Autopilot telemetry radio (SiK 433 MHz / LoRa / RFD900)
# Adjust Device and Baud to match your hardware
# ---------------------------------------------------------------------------
[UartEndpoint TelemetryRadio]
Device = /dev/ttyS3
Baud = 57600

# ---------------------------------------------------------------------------
# RC bridge daemon (crsf2mavlink or similar)
# Receives CRSF frames from RC receiver and emits RC_CHANNELS MAVLink messages
# ---------------------------------------------------------------------------
[UartEndpoint RCBridge]
Device = /dev/ttyS2
Baud = 420000

# ---------------------------------------------------------------------------
# QGroundControl - running locally on the AM62P display
# ---------------------------------------------------------------------------
[UdpEndpoint QGC]
Mode = Normal
Address = 127.0.0.1
Port = 14550

# ---------------------------------------------------------------------------
# MAVSDK companion application (mission automation, geofencing, etc.)
# ---------------------------------------------------------------------------
[UdpEndpoint MAVSDK]
Mode = Normal
Address = 127.0.0.1
Port = 14540

# ---------------------------------------------------------------------------
# Remote GCS over Wi-Fi (optional - for external laptop/tablet GCS)
# Listens on all interfaces; connects on first incoming packet
# Comment out or restrict to a specific interface in production
# ---------------------------------------------------------------------------
[UdpEndpoint RemoteGCS]
Mode = Eavesdropping
Address = 0.0.0.0
Port = 14551
