# /etc/crsf2mavlink/crsf2mavlink.conf
#
# Configuration for the CRSF to MAVLink bridge daemon.
# Changes take effect on next service restart: systemctl restart crsf2mavlink
#
# CLI arguments (-d, -b, -h, -p) override these values when running manually.

# Serial device connected to the RC receiver CRSF output
# ExpressLRS / TBS Crossfire receivers default to 420000 baud
# Some modules use 115200 baud - check your receiver documentation
DEVICE=/dev/ttyS2
BAUD=420000

# MAVLink-router UDP endpoint to forward RC_CHANNELS_OVERRIDE messages to.
# Must match the MAVSDK UdpEndpoint in /etc/mavlink-router/main.conf.
HOST=127.0.0.1
PORT=14540
